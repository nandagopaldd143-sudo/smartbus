 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SmartBus - Live Tracking</title>

    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    >

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background:
                radial-gradient(circle at top right, #164e63, transparent 35%),
                linear-gradient(135deg, #020617, #0f172a, #111827);
            color: white;
            padding: 18px;
        }

        .container {
            max-width: 800px;
            margin: auto;
        }

        header {
            padding: 12px 5px 25px;
        }

        .brand {
            color: #38bdf8;
            font-size: 14px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        header h1 {
            font-size: 30px;
            margin-top: 8px;
        }

        .back {
            display: inline-block;
            margin-top: 12px;
            color: #94a3b8;
            text-decoration: none;
            font-size: 14px;
        }

        .back:hover {
            color: #38bdf8;
        }

        .tracking-card {
            background: rgba(255,255,255,0.07);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 24px;
            padding: 22px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.30);
        }

        .bus-title {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 22px;
        }

        .bus-title h2 {
            font-size: 27px;
        }

        .live {
            background: rgba(34,197,94,0.15);
            color: #4ade80;
            border: 1px solid rgba(74,222,128,0.3);
            padding: 7px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }

        .info {
            margin-bottom: 17px;
        }

        .label {
            color: #94a3b8;
            font-size: 12px;
            margin-bottom: 6px;
        }

        .value {
            font-size: 17px;
            font-weight: bold;
        }

        .map-section {
            margin-top: 25px;
        }

        .map-title {
            font-size: 21px;
            font-weight: bold;
            margin-bottom: 6px;
        }

        .map-subtitle {
            color: #94a3b8;
            font-size: 13px;
            margin-bottom: 15px;
        }

        #map {
            width: 100%;
            height: 400px;
            border-radius: 18px;
            overflow: hidden;
        }

        .gps-button {
            width: 100%;
            margin-top: 15px;
            padding: 14px;
            border: none;
            border-radius: 14px;
            background: #0ea5e9;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .gps-button:hover {
            background: #0284c7;
        }

        .location-status {
            margin-top: 14px;
            padding: 13px;
            border-radius: 14px;
            background: rgba(14,165,233,0.10);
            color: #cbd5e1;
            text-align: center;
            font-size: 13px;
        }

        footer {
            text-align: center;
            color: #64748b;
            font-size: 12px;
            padding: 22px 0 8px;
        }

        @media (max-width: 500px) {
            body {
                padding: 12px;
            }

            header h1 {
                font-size: 25px;
            }

            .tracking-card {
                padding: 17px;
            }

            #map {
                height: 320px;
            }

            .bus-title h2 {
                font-size: 23px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <header>
        <div class="brand">
            SMARTBUS • LIVE TRACKING
        </div>

        <h1>
            🚌 College Bus Tracking
        </h1>

        <a href="{% url 'home' %}" class="back">
            ← Back to Dashboard
        </a>
    </header>


    <div class="tracking-card">

        <div class="bus-title">
            <h2>
                📍 Bus {{ bus.bus_number }}
            </h2>

            <div class="live">
                ● LIVE
            </div>
        </div>


        <div class="info">
            <div class="label">
                DEPARTURE
            </div>

            <div class="value">
                ⏰ {{ bus.time }}
            </div>
        </div>


        <div class="info">
            <div class="label">
                DESTINATION
            </div>

            <div class="value">
                📍 {{ bus.destination }}
            </div>
        </div>


        <div class="map-section">

            <div class="map-title">
                🗺️ Current Bus Location
            </div>

            <div class="map-subtitle">
                GPS location updates automatically
            </div>

            <div id="map"></div>

            <button
                class="gps-button"
                onclick="startGPS()">
                📍 Start Live GPS
            </button>

            <div
                class="location-status"
                id="locationStatus">
                🔵 GPS not started
            </div>

        </div>

    </div>


    <footer>
        SmartBus © 2026 • College Bus Tracking System
    </footer>

</div>


<script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
</script>


<script>

    /*
        Default location:
        Polur Bus Stand
    */

    const defaultLatitude = 12.5036;
    const defaultLongitude = 79.0608;


    // Create map
    const map = L.map("map").setView(
        [defaultLatitude, defaultLongitude],
        14
    );


    // OpenStreetMap
    L.tileLayer(
        "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
        {
            maxZoom: 19,

            attribution:
                "&copy; OpenStreetMap contributors"
        }
    ).addTo(map);


    // Bus icon
    const busIcon = L.divIcon({

        className: "bus-marker",

        html: `
            <div style="
                background:#2563eb;
                color:white;
                width:48px;
                height:48px;
                border-radius:50%;
                display:flex;
                align-items:center;
                justify-content:center;
                font-size:25px;
                border:3px solid white;
                box-shadow:0 5px 18px rgba(0,0,0,.5);
            ">
                🚌
            </div>
        `,

        iconSize: [48, 48],
        iconAnchor: [24, 24]
    });


    // Initial bus marker
    let busMarker = L.marker(
        [defaultLatitude, defaultLongitude],
        {
            icon: busIcon
        }
    ).addTo(map);


    busMarker.bindPopup(`
        <div style="text-align:center;">
            <strong>🚌 SMARTBUS</strong>
            <br><br>
            <strong>BUS {{ bus.bus_number }}</strong>
            <br>
            🟢 GPS Ready
        </div>
    `);


    /*
        START LIVE GPS
    */

    function startGPS() {

        const status =
            document.getElementById("locationStatus");


        if (!navigator.geolocation) {

            status.innerHTML =
                "🔴 GPS is not supported by this browser.";

            return;
        }


        status.innerHTML =
            "🟡 Requesting GPS permission...";


        navigator.geolocation.watchPosition(

            function(position) {

                const latitude =
                    position.coords.latitude;

                const longitude =
                    position.coords.longitude;


                /*
                    Move bus marker
                */

                busMarker.setLatLng([
                    latitude,
                    longitude
                ]);


                /*
                    Move map
                */

                map.setView(
                    [latitude, longitude],
                    16
                );


                /*
                    Update popup
                */

                busMarker.bindPopup(`
                    <div style="text-align:center;">
                        <strong>🚌 SMARTBUS</strong>
                        <br><br>
                        <strong>BUS {{ bus.bus_number }}</strong>
                        <br>
                        🟢 GPS ACTIVE
                        <br><br>
                        📍 ${latitude.toFixed(6)},
                        ${longitude.toFixed(6)}
                    </div>
                `);


                /*
                    Status
                */

                status.innerHTML =
                    "🟢 GPS Active • Location updating live";

            },

            function(error) {

                if (error.code === 1) {

                    status.innerHTML =
                        "🔴 GPS permission denied. Allow location access.";

                } else if (error.code === 2) {

                    status.innerHTML =
                        "🔴 GPS location unavailable.";

                } else if (error.code === 3) {

                    status.innerHTML =
                        "🔴 GPS request timed out.";

                } else {

                    status.innerHTML =
                        "🔴 Unable to get GPS location.";

                }

            },

            {
                enableHighAccuracy: true,
                maximumAge: 5000,
                timeout: 10000
            }

        );

    }

</script>

</body>
</html>
