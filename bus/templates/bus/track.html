 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SmartBus • Live Tracking</title>

    <!-- Leaflet Map -->
    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #07111f, #101b33, #07111f);
            color: white;
            min-height: 100vh;
        }

        .header {
            padding: 22px 18px;
            text-align: center;
            background: rgba(10, 20, 40, 0.92);
            border-bottom: 1px solid rgba(255,255,255,0.12);
        }

        .header h1 {
            margin: 0;
            font-size: 27px;
            font-weight: 800;
        }

        .header p {
            margin: 7px 0 0;
            color: #aebbd3;
            font-size: 13px;
            letter-spacing: 1px;
        }

        .container {
            width: 94%;
            max-width: 850px;
            margin: 20px auto;
        }

        .card {
            background: rgba(255,255,255,0.09);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 24px;
            padding: 20px;
            margin-bottom: 18px;
            backdrop-filter: blur(18px);
            box-shadow: 0 15px 45px rgba(0,0,0,0.35);
        }

        .bus-title {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .bus-icon {
            font-size: 38px;
        }

        .bus-title h2 {
            margin: 0;
            font-size: 25px;
        }

        .live-badge {
            display: inline-block;
            margin-top: 6px;
            padding: 5px 10px;
            border-radius: 20px;
            background: rgba(0, 255, 150, 0.12);
            color: #00ff9d;
            font-size: 12px;
            font-weight: bold;
        }

        .details {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 20px;
        }

        .detail-box {
            background: rgba(0,0,0,0.18);
            border-radius: 15px;
            padding: 14px;
        }

        .detail-label {
            color: #91a0ba;
            font-size: 12px;
            margin-bottom: 6px;
        }

        .detail-value {
            font-size: 16px;
            font-weight: 700;
        }

        .status {
            margin-top: 16px;
            padding: 14px;
            border-radius: 15px;
            background: rgba(255,255,255,0.06);
            font-weight: 700;
        }

        .status-dot {
            display: inline-block;
            width: 11px;
            height: 11px;
            border-radius: 50%;
            margin-right: 8px;
            background: #ff3b3b;
            box-shadow: 0 0 12px #ff3b3b;
        }

        .status-dot.live {
            background: #00ff88;
            box-shadow: 0 0 15px #00ff88;
        }

        #map {
            width: 100%;
            height: 430px;
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.12);
        }

        .gps-button {
            width: 100%;
            margin-top: 16px;
            padding: 15px;
            border: none;
            border-radius: 15px;
            background: linear-gradient(135deg, #087fff, #00c6ff);
            color: white;
            font-size: 16px;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 8px 25px rgba(0,140,255,0.3);
        }

        .gps-button:active {
            transform: scale(0.98);
        }

        .location-info {
            margin-top: 15px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .coordinate {
            background: rgba(0,0,0,0.18);
            padding: 13px;
            border-radius: 13px;
        }

        .coordinate small {
            color: #8e9bb1;
            display: block;
            margin-bottom: 5px;
        }

        .coordinate strong {
            font-size: 14px;
        }

        .footer {
            text-align: center;
            color: #718099;
            font-size: 12px;
            padding: 10px 0 25px;
        }

        @media (max-width: 600px) {
            .header h1 {
                font-size: 24px;
            }

            .details {
                grid-template-columns: 1fr;
            }

            #map {
                height: 390px;
            }

            .location-info {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<div class="header">
    <h1>🚌 SMARTBUS • LIVE TRACKING</h1>
    <p>COLLEGE BUS TRACKING SYSTEM</p>
</div>

<div class="container">

    <!-- BUS DETAILS -->
    <div class="card">

        <div class="bus-title">
            <div class="bus-icon">🚌</div>

            <div>
                <h2>Bus {{ bus.bus_number }}</h2>
                <span class="live-badge">● LIVE TRACKING</span>
            </div>
        </div>

        <div class="details">

            <div class="detail-box">
                <div class="detail-label">🕐 DEPARTURE</div>
                <div class="detail-value">{{ bus.time }}</div>
            </div>

            <div class="detail-box">
                <div class="detail-label">📍 DESTINATION</div>
                <div class="detail-value">
                    {{ bus.destination }}
                </div>
            </div>

        </div>

        <div class="status">
            <span id="statusDot" class="status-dot"></span>
            <span id="statusText">Location unavailable</span>
        </div>

    </div>


    <!-- MAP -->
    <div class="card">

        <h2 style="margin-top:0;">📍 Current Bus Location</h2>

        <div id="map"></div>

        <!-- DRIVER GPS BUTTON -->
        <button class="gps-button" onclick="startGPS()">
            📡 START LIVE GPS
        </button>

        <div class="location-info">

            <div class="coordinate">
                <small>Latitude</small>
                <strong id="latitude">Waiting...</strong>
            </div>

            <div class="coordinate">
                <small>Longitude</small>
                <strong id="longitude">Waiting...</strong>
            </div>

        </div>

    </div>

    <div class="footer">
        SmartBus • College Bus Tracking System
    </div>

</div>


<!-- Leaflet -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

    const busId = "{{ bus.id }}";

    /*
     * Initial map position
     * Polur area
     */
    const defaultLat = 12.5036;
    const defaultLng = 79.0608;

    const map = L.map("map").setView(
        [defaultLat, defaultLng],
        13
    );

    L.tileLayer(
        "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
        {
            maxZoom: 19,
            attribution: "&copy; OpenStreetMap contributors"
        }
    ).addTo(map);


    /*
     * Bus marker
     */
    const busIcon = L.divIcon({
        className: "bus-marker",
        html: "🚌",
        iconSize: [40, 40],
        iconAnchor: [20, 20]
    });

    let busMarker = null;


    /*
     * Update marker on map
     */
    function showBusLocation(lat, lng) {

        document.getElementById("latitude").innerText =
            Number(lat).toFixed(6);

        document.getElementById("longitude").innerText =
            Number(lng).toFixed(6);

        if (busMarker) {

            busMarker.setLatLng([lat, lng]);

        } else {

            busMarker = L.marker(
                [lat, lng],
                { icon: busIcon }
            ).addTo(map);

            busMarker.bindPopup(
                "🚌 Bus " + "{{ bus.bus_number }}"
            );

        }

        map.setView([lat, lng], 16);

        document
            .getElementById("statusDot")
            .classList.add("live");

        document
            .getElementById("statusText")
            .innerText = "Live location available";
    }


    /*
     * DRIVER PHONE GPS
     */
    let gpsWatcher = null;

    function startGPS() {

        if (!navigator.geolocation) {

            alert("GPS is not supported on this phone.");

            return;
        }

        document.getElementById("statusText").innerText =
            "Getting GPS location...";


        gpsWatcher = navigator.geolocation.watchPosition(

            function(position) {

                const lat =
                    position.coords.latitude;

                const lng =
                    position.coords.longitude;

                showBusLocation(lat, lng);

                /*
                 * Send driver's GPS location
                 * to Django backend
                 */
                fetch(
                    `/api/bus/${busId}/location/update/`,
                    {
                        method: "POST",

                        headers: {
                            "Content-Type": "application/json",
                            "X-CSRFToken": getCookie("csrftoken")
                        },

                        body: JSON.stringify({
                            latitude: lat,
                            longitude: lng
                        })
                    }
                )
                .then(response => {

                    if (!response.ok) {
                        console.log(
                            "GPS update failed:",
                            response.status
                        );
                    }

                })
                .catch(error => {

                    console.log(
                        "GPS server error:",
                        error
                    );

                });

            },

            function(error) {

                console.log(error);

                document.getElementById("statusText").innerText =
                    "GPS permission required";

                alert(
                    "Please allow Location permission for this website."
                );

            },

            {
                enableHighAccuracy: true,
                maximumAge: 5000,
                timeout: 10000
            }

        );
    }


    /*
     * STUDENT SIDE
     * Get latest bus location from Django
     */
    function getLiveLocation() {

        fetch(
            `/api/bus/${busId}/location/`
        )
        .then(response => response.json())
        .then(data => {

            if (
                data.latitude !== undefined &&
                data.longitude !== undefined &&
                data.latitude != 0 &&
                data.longitude != 0
            ) {

                showBusLocation(
                    data.latitude,
                    data.longitude
                );

            }

        })
        .catch(error => {

            console.log(
                "Location fetch error:",
                error
            );

        });

    }


    /*
     * Run every 5 seconds
     */
    getLiveLocation();

    setInterval(
        getLiveLocation,
        5000
    );


    /*
     * Django CSRF cookie
     */
    function getCookie(name) {

        let cookieValue = null;

        if (document.cookie && document.cookie !== "") {

            const cookies =
                document.cookie.split(";");

            for (
                let i = 0;
                i < cookies.length;
                i++
            ) {

                const cookie =
                    cookies[i].trim();

                if (
                    cookie.substring(
                        0,
                        name.length + 1
                    ) ===
                    (name + "=")
                ) {

                    cookieValue =
                        decodeURIComponent(
                            cookie.substring(
                                name.length + 1
                            )
                        );

                    break;
                }
            }
        }

        return cookieValue;
    }

</script>

</body>
</html>
