 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SmartBus - Live Tracking</title>

    <!-- Leaflet CSS -->
    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
        }

        .header {
            background: #111827;
            color: white;
            padding: 18px;
            text-align: center;
        }

        .header h2 {
            margin: 0;
        }

        .info {
            background: white;
            margin: 12px;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.12);
        }

        .info p {
            margin: 7px 0;
        }

        .status {
            font-weight: bold;
        }

        #map {
            width: calc(100% - 24px);
            height: 65vh;
            margin: 12px;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 3px 12px rgba(0,0,0,0.18);
        }

        .location-box {
            background: white;
            margin: 12px;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.12);
        }

        .location-box h3 {
            margin-top: 0;
        }

        #address {
            color: #374151;
            line-height: 1.5;
        }

        .loading {
            color: #6b7280;
        }
    </style>
</head>

<body>

<div class="header">
    <h2>🚌 SmartBus Live Tracking</h2>
</div>

<div class="info">

    <p>
        <strong>Bus Number:</strong>
        {{ bus.bus_number }}
    </p>

    <p>
        <strong>Destination:</strong>
        {{ bus.destination }}
    </p>

    <p>
        <strong>Status:</strong>
        <span class="status" id="status">
            Connecting...
        </span>
    </p>

</div>

<div id="map"></div>

<div class="location-box">

    <h3>📍 Current Bus Location</h3>

    <div id="address" class="loading">
        Finding current location...
    </div>

</div>

<!-- Leaflet JS -->
<script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
</script>

<script>

const busId = "{{ bus.id }}";

let map;
let busMarker;
let firstLocation = true;


/* --------------------------------
   CREATE MAP
-------------------------------- */

function createMap(latitude, longitude) {

    map = L.map("map").setView(
        [latitude, longitude],
        16
    );

    L.tileLayer(
        "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
        {
            maxZoom: 19,
            attribution:
                '&copy; OpenStreetMap contributors'
        }
    ).addTo(map);

}


/* --------------------------------
   BUS ICON
-------------------------------- */

const busIcon = L.divIcon({

    className: "bus-marker",

    html: `
        <div style="
            background:#2563eb;
            color:white;
            width:45px;
            height:45px;
            border-radius:50%;
            display:flex;
            align-items:center;
            justify-content:center;
            font-size:24px;
            border:3px solid white;
            box-shadow:0 3px 10px rgba(0,0,0,0.35);
        ">
            🚌
        </div>
    `,

    iconSize: [45, 45],
    iconAnchor: [22, 22]

});


/* --------------------------------
   GET BUS LOCATION
-------------------------------- */

async function getBusLocation() {

    try {

        const response = await fetch(
            `/api/bus/${busId}/location/`
        );

        if (!response.ok) {

            throw new Error(
                "Location API error: " + response.status
            );

        }

        const data = await response.json();

        const latitude = parseFloat(data.latitude);
        const longitude = parseFloat(data.longitude);


        if (
            isNaN(latitude) ||
            isNaN(longitude) ||
            latitude === 0 ||
            longitude === 0
        ) {

            document.getElementById("status").innerText =
                "Waiting for GPS...";

            return;

        }


        /* CREATE MAP FIRST TIME */

        if (!map) {

            createMap(
                latitude,
                longitude
            );

        }


        /* CREATE / MOVE MARKER */

        if (!busMarker) {

            busMarker = L.marker(
                [latitude, longitude],
                {
                    icon: busIcon
                }
            ).addTo(map);

            busMarker.bindPopup(
                `<b>🚌 BUS ${data.bus}</b><br>
                 Current Location`
            );

        } else {

            busMarker.setLatLng(
                [latitude, longitude]
            );

        }


        /* CENTER MAP */

        if (firstLocation) {

            map.setView(
                [latitude, longitude],
                17
            );

            firstLocation = false;

        }


        document.getElementById("status").innerText =
            "🟢 Live";


        /* GET STREET ADDRESS */

        getAddress(
            latitude,
            longitude
        );

    }

    catch (error) {

        console.error(error);

        document.getElementById("status").innerText =
            "🔴 Location unavailable";

    }

}


/* --------------------------------
   GET ACTUAL ADDRESS
-------------------------------- */

async function getAddress(
    latitude,
    longitude
) {

    try {

        const response = await fetch(
            `https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${latitude}&lon=${longitude}&zoom=18&addressdetails=1`,
            {
                headers: {
                    "Accept": "application/json"
                }
            }
        );

        if (!response.ok) {

            throw new Error(
                "Address lookup failed"
            );

        }

        const data = await response.json();


        if (data.display_name) {

            document.getElementById(
                "address"
            ).innerText =
                data.display_name;

        } else {

            document.getElementById(
                "address"
            ).innerText =
                "Address not available";

        }

    }

    catch (error) {

        console.error(error);

        document.getElementById(
            "address"
        ).innerText =
            "Unable to find street address";

    }

}


/* --------------------------------
   START
-------------------------------- */

getBusLocation();


/* --------------------------------
   UPDATE EVERY 5 SECONDS
-------------------------------- */

setInterval(
    getBusLocation,
    5000
);

</script>

</body>
</html>
